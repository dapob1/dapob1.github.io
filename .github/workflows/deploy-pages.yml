name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Repo Pages settings still use legacy "Deploy from a branch" (main /).
# peaceiris blocks main→main, so we copy out/ onto main and push with [skip ci].
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Publish out/ to main for legacy Pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Merge static export into repo root without wiping Next.js source
          cp -a out/. .
          touch .nojekyll
          printf '%s\n' 'adwa.studio' > CNAME

          git add -A
          if git diff --cached --quiet; then
            echo "No static publish changes"
            exit 0
          fi

          git commit -m "Deploy static site [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Bind custom domain via Pages API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          response=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"cname":"adwa.studio","https_enforced":true,"build_type":"workflow"}')
          echo "HTTP $response"
          cat /tmp/pages.json || true
