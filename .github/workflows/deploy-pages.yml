name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Repo Pages settings still use legacy "Deploy from a branch" (main /).
# Actions artifact deploys are ignored for adwa.studio, so we publish the
# static export onto main (keep source files) and skip the follow-up CI loop.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Publish out/ to main for legacy Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: main
          keep_files: true
          enable_jekyll: false
          cname: adwa.studio
          commit_message: "Deploy static site [skip ci]"

      - name: Bind custom domain via Pages API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          response=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"cname":"adwa.studio","https_enforced":true,"build_type":"workflow"}')
          echo "HTTP $response"
          cat /tmp/pages.json || true
